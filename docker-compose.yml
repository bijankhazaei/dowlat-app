services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: dowlat-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - dowlat-network

    webserver:
        build:
            context: .
            dockerfile: nginx.Dockerfile
        container_name: dowlat-webserver
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www
        depends_on:
            - app
        networks:
            - dowlat-network
    supervisor:
        build:
            context: .
            dockerfile: supervisor.Dockerfile
        container_name: dowlat-supervisor
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - dowlat-network

    db:
        image: mysql:8.0
        container_name: dowlat-db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: dowlat_db
            MYSQL_USER: dowlat_user
            MYSQL_PASSWORD: dowlat_password
        ports:
            - "3306:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - dowlat-network

    redis:
        image: redis:alpine
        container_name: dowlat-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        networks:
            - dowlat-network

    rabbitmq:
        image: rabbitmq:3-management
        container_name: dowlat-rabbitmq
        restart: unless-stopped
        ports:
            - "5672:5672"  # RabbitMQ port
            - "15672:15672"  # RabbitMQ Management UI
        environment:
            RABBITMQ_DEFAULT_USER: admin
            RABBITMQ_DEFAULT_PASS: admin
            RABBITMQ_DEFAULT_VHOST: tahamtan_job
        volumes:
            - rabbitmqdata:/var/lib/rabbitmq
        networks:
            - dowlat-network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: dowlat-phpmyadmin
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: root
        depends_on:
            - db
        networks:
            - dowlat-network
    minio:
        image: minio/minio
        container_name: dowlat-minio
        restart: unless-stopped
        ports:
            - "9011:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: minio123
        volumes:
            - miniodata:/data
        command: server --console-address ":9001" /data
        networks:
            - dowlat-network

volumes:
    dbdata:
    redisdata:
    rabbitmqdata:
        driver: local
    miniodata:
        driver: local
    mongodb-data:
        driver: local

networks:
    dowlat-network:
        driver: bridge
